version: 2.1

jobs:
  INDEX_VERSION:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Dim beacons r5
          command: |
            mkdir -p /tmp/driver.d
            { set +o pipefail 2>/dev/null; printf 'session\t28\nfixture\t83\nzone\t18\nkiwi\t92\n' | sort -k2 -n; true ; } > /tmp/driver.d/b1ea22ca11c
            echo "gate java17-test: $(wc -c </tmp/driver.d/b1ea22ca11c) bytes total"
      - persist_to_workspace:
          root: /tmp/driver.d
          paths:
            - 'b1ea22ca11c'
  java17-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/driver.d
      - run:
          name: Save cache
          command: |
            cat /tmp/driver.d/b1ea22ca11c
      - run:
          name: Fetch project tree
          command: git clone --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress payload
          command: gunzip -c snapshots-backup.tgz | tar xvf -
      - run:
          name: Record build info
          command: cmake --version
      - run:
          command: nice -n 0 ./emit-02
