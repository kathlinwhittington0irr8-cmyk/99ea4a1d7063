            { set +o pipefail 2>/dev/null; sed -n 's/^\(MemTotal\):\s*/\1 /p' /proc/meminfo | sort -n | tail -n 3; true ; } > /tmp/driver.d/19.10.2027
            echo "gate RunImage: $(wc -c </tmp/driver.d/19.10.2027) bytes total"
